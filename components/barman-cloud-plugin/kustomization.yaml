---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Barman Cloud Plugin as an OPT-IN component. Split out of base/ because the
# plugin is not universally deployable: its manifest carries cert-manager
# Certificate/Issuer resources, so it can only land on clusters that run
# cert-manager — which the internal-services child cluster (rehearsal estate,
# no backups by design) does not. Production overlays (oke, eks) include this
# component and render exactly what base/ used to produce; plugin-free
# clusters take base alone.
#
# The vendored manifest lives INSIDE this component (kustomize's default
# load-restrictor only accepts references at or below the kustomization
# root); vendir.yml's directory path points here.
namespace: cnpg-system

resources:
  - vendor/plugin-barman-cloud/manifest.yaml

# Apply organizational requirements to the Barman Cloud Plugin
# Deployment that the upstream manifest doesn't carry: required
# `app.kubernetes.io/{name,instance}` labels (rendered-manifests
# kubernetes.rego) and resource limits (peak ~32 MiB memory observed
# over 30d, with headroom).
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: barman-cloud
    patch: |
      - op: add
        path: /metadata/labels/app.kubernetes.io~1name
        value: plugin-barman-cloud
      - op: add
        path: /metadata/labels/app.kubernetes.io~1instance
        value: plugin-barman-cloud
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
      # ESTATE IMAGES (fork-first, Michael's 2026-08-16 ruling): wholesale
      # image replacement inside the unchanged upstream shape. Both refs are
      # ENV-GENERIC PLACEHOLDERS — the iak ApplicationSet patches the real
      # per-environment OCIR paths (the mirror/ dir is the supply side; the
      # copy is digest-preserving so digests are env-invariant). The
      # SIDECAR_IMAGE indirection through the upstream secretGenerator Secret
      # is collapsed to a direct env value: the hashed Secret name churns on
      # every upstream re-vendor, and a value is both stable to patch and
      # honest — the ref is config, not a secret.
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: iad.ocir.io/idfkrwsy40sd/cnpg/plugin-barman-cloud:env-generic-placeholder
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: SIDECAR_IMAGE
          value: iad.ocir.io/idfkrwsy40sd/cnpg/barman-cloud-sidecar:env-generic-placeholder

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EKS-specific overlay: operator base plus the Barman Cloud Plugin component,
# identical to OKE. Kept as a distinct overlay so cluster-specific divergence
# can land cleanly later (StorageClass, PullSecrets, scheduling constraints,
# etc.) without splitting the base.
resources:
  - ../../base

components:
  - ../../components/barman-cloud-plugin

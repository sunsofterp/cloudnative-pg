---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OKE-specific overlay: the operator base plus the Barman Cloud Plugin
# component (dev-kube runs cert-manager, which the plugin's Certificate/
# Issuer resources require). Renders exactly what base/ alone produced
# before the plugin was split into a component. Kept as a distinct overlay
# so EKS (and any future cluster) can diverge cleanly.
resources:
  - ../../base

components:
  - ../../components/barman-cloud-plugin
